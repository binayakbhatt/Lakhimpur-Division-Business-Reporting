<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakhimpur Postal Division - Business Reporting</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [view, setView] = React.useState("entry"); // 'entry', 'dashboard', 'admin'

        // Master Data (Managed via Admin)
        const [offices, setOffices] = React.useState([
          {
            id: "LKP_SO_North_01",
            name: "North Lakhimpur H.O (SO)",
            type: "SO",
            incumbent: "Shri Pranjal Saikia",
            contact: "9864011111",
          },
          {
            id: "LKP_SO_Bihpuria_03",
            name: "Bihpuria S.O.",
            type: "SO",
            incumbent: "Smti Ananya Hazarika",
            contact: "9864022222",
          },
          {
            id: "LKP_BO_Gereki_02",
            name: "Gereki Branch Post Office (BO)",
            type: "BO",
            incumbent: "Shri Ramesh Gogoi",
            contact: "9864033333",
          },
          {
            id: "LKP_BO_Daulatpur_04",
            name: "Daulatpur Branch Post Office (BO)",
            type: "BO",
            incumbent: "Shri Bhaben Doley",
            contact: "9864044444",
          },
        ]);

        const [selectedOfficeId, setSelectedOfficeId] =
          React.useState("LKP_BO_Gereki_02");
        const [entryDate, setEntryDate] = React.useState(
          new Date().toISOString().split("T")[0],
        );

        // Form inputs
        const [formData, setFormData] = React.useState({
          aadhaarCount: 5,
          posbDepVol: 15000,
          posbWdVol: 2000,
          pliCount: 1,
          pliPremium: 4500,
          pliSumAssured: 200000,
          parcelCount: 12,
          retailCount: 8,
        });

        // Submitted Entries DB State
        const [entries, setEntries] = React.useState([
          {
            id: 1,
            officeId: "LKP_SO_North_01",
            name: "North Lakhimpur H.O (SO)",
            type: "SO",
            incumbent: "Shri Pranjal Saikia",
            date: "2026-11-11",
            revenue: 5850,
            aadhaar: 18,
            pli: 14500,
            parcel: 35,
          },
          {
            id: 2,
            officeId: "LKP_BO_Gereki_02",
            name: "Gereki Branch Post Office (BO)",
            type: "BO",
            incumbent: "Shri Ramesh Gogoi",
            date: "2026-11-11",
            revenue: 2430,
            aadhaar: 5,
            pli: 4500,
            parcel: 12,
          },
          {
            id: 3,
            officeId: "LKP_SO_Bihpuria_03",
            name: "Bihpuria S.O.",
            type: "SO",
            incumbent: "Smti Ananya Hazarika",
            date: "2026-11-11",
            revenue: 4120,
            aadhaar: 12,
            pli: 9200,
            parcel: 28,
          },
        ]);

        // Admin login state
        const [adminPassword, setAdminPassword] = React.useState("");
        const [isAdminAuthenticated, setIsAdminAuthenticated] =
          React.useState(false);
        const [newOffice, setNewOffice] = React.useState({
          id: "",
          name: "",
          type: "BO",
          incumbent: "",
          contact: "",
        });

        // Toast notification state
        const [toastMessage, setToastMessage] = React.useState("");

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(""), 3000);
        };

        const currentOffice =
          offices.find((o) => o.id === selectedOfficeId) || offices[0];

        // Revenue Calculation Engine
        const calculateRevenue = () => {
          const aadhaarRev = formData.aadhaarCount * 50; // ₹50 per Aadhaar txn
          const pliRev = formData.pliPremium * 0.1; // 10% first-year premium commission
          const parcelRev = formData.parcelCount * 25; // ₹25 avg postal booking commission
          const turnoverRev =
            formData.posbDepVol * 0.001 + formData.retailCount * 10;
          return Math.round(aadhaarRev + pliRev + parcelRev + turnoverRev);
        };

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData((prev) => ({ ...prev, [name]: parseFloat(value) || 0 }));
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          const totalRev = calculateRevenue();
          const newRecord = {
            id: entries.length + 1,
            officeId: currentOffice.id,
            name: currentOffice.name,
            type: currentOffice.type,
            incumbent: currentOffice.incumbent,
            date: entryDate,
            revenue: totalRev,
            aadhaar: formData.aadhaarCount,
            pli: formData.pliPremium,
            parcel: formData.parcelCount,
          };
          setEntries([newRecord, ...entries]);
          showToast(
            `Daily Report Submitted Successfully! Calculated Revenue: ₹${totalRev.toLocaleString("en-IN")}`,
          );
          setView("dashboard");
        };

        // WhatsApp Format Generator
        const generateWhatsAppText = () => {
          const totalRev = calculateRevenue();
          return (
            `📌 *LAKHIMPUR POSTAL DIVISION - DAILY BUSINESS REPORT* 📌\n` +
            `📅 Date: ${entryDate}\n` +
            `🏢 Office: ${currentOffice.name} (${currentOffice.type})\n` +
            `👤 Official/BPM: ${currentOffice.incumbent} (${currentOffice.contact})\n\n` +
            `--- *BUSINESS TRANSACTIONS* ---\n` +
            `• Aadhaar Enrol/Updates: ${formData.aadhaarCount}\n` +
            `• POSB Deposits: ₹${formData.posbDepVol.toLocaleString("en-IN")}\n` +
            `• POSB Withdrawals: ₹${formData.posbWdVol.toLocaleString("en-IN")}\n` +
            `• PLI Proposals: ${formData.pliCount} (Sum Assured: ₹${formData.pliSumAssured.toLocaleString("en-IN")})\n` +
            `• PLI Premium Coll.: ₹${formData.pliPremium.toLocaleString("en-IN")}\n` +
            `• Mails & Parcels Booked: ${formData.parcelCount}\n` +
            `• Retail Services: ${formData.retailCount}\n\n` +
            `💰 *Estimated Calculated Revenue:* *₹ ${totalRev.toLocaleString("en-IN")}*`
          );
        };

        const copyToClipboard = () => {
          navigator.clipboard.writeText(generateWhatsAppText());
          showToast("📋 Copied Daily Report to Clipboard for WhatsApp!");
        };

        const shareOnWhatsApp = () => {
          const text = encodeURIComponent(generateWhatsAppText());
          window.open(`https://api.whatsapp.com/send?text=${text}`, "_blank");
        };

        // Find Top Performers for Today
        const todayEntries = entries.filter((e) => e.date === entryDate);
        const topSO = todayEntries
          .filter((e) => e.type === "SO")
          .sort((a, b) => b.revenue - a.revenue)[0];
        const topBO = todayEntries
          .filter((e) => e.type === "BO")
          .sort((a, b) => b.revenue - a.revenue)[0];

        return (
          <div className="min-h-screen flex flex-col bg-slate-100">
            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium border border-slate-700 animate-bounce">
                {toastMessage}
              </div>
            )}

            {/* Header */}
            <header className="bg-red-800 text-white shadow">
              <div className="max-w-5xl mx-auto p-4 flex flex-col md:flex-row justify-between items-center gap-3">
                <div>
                  <h1 className="text-lg font-bold">
                    Lakhimpur Postal Division Business Radar
                  </h1>
                  <p className="text-xs text-red-200">
                    Sub Divisional Office & Branch Office Daily Analytics
                  </p>
                </div>
                <nav className="flex space-x-2">
                  <button
                    onClick={() => setView("entry")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "entry" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Daily Entry (No Login)
                  </button>
                  <button
                    onClick={() => setView("dashboard")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "dashboard" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Division Dashboard & Leaders
                  </button>
                  <button
                    onClick={() => setView("admin")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "admin" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Admin Master Setup
                  </button>
                </nav>
              </div>
            </header>

            {/* Main Container */}
            <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
              {/* VIEW 1: DAILY ENTRY FORM (NO LOGIN) */}
              {view === "entry" && (
                <div className="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto border-t-4 border-red-700 space-y-6">
                  <div className="pb-3 border-b flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-slate-800">
                        Daily Business Data Entry
                      </h2>
                      <p className="text-xs text-slate-500">
                        Select your office from the list below to log daily
                        metrics
                      </p>
                    </div>
                    <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-medium">
                      No Login Required
                    </span>
                  </div>

                  <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded border">
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-600 mb-1">
                          Select Office Name
                        </label>
                        <select
                          value={selectedOfficeId}
                          onChange={(e) => setSelectedOfficeId(e.target.value)}
                          className="w-full border rounded p-2 text-sm bg-white font-medium"
                        >
                          {offices.map((o) => (
                            <option key={o.id} value={o.id}>
                              {o.name} ({o.type})
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-600 mb-1">
                          Reporting Date
                        </label>
                        <input
                          type="date"
                          value={entryDate}
                          onChange={(e) => setEntryDate(e.target.value)}
                          className="w-full border rounded p-2 text-sm bg-white"
                          required
                        />
                      </div>
                      <div className="md:col-span-2 text-xs text-slate-600 flex justify-between bg-white p-2.5 rounded border">
                        <span>
                          <strong>Incumbent Official / BPM:</strong>{" "}
                          {currentOffice.incumbent}
                        </span>
                        <span>
                          <strong>Contact:</strong> {currentOffice.contact}
                        </span>
                      </div>
                    </div>

                    {/* Business Transactions Card */}
                    <div className="border rounded-lg p-4 space-y-4 bg-white shadow-sm">
                      <div className="border-b pb-2">
                        <h3 className="font-bold text-slate-800 text-sm">
                          Business Transactions
                        </h3>
                        <p className="text-xs text-slate-500">
                          Enter daily volumes for accounts, deposits, and
                          insurance
                        </p>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            Aadhaar Enrolments / Updates (Count)
                          </label>
                          <input
                            type="number"
                            name="aadhaarCount"
                            value={formData.aadhaarCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            Mails & Parcels Booked (Count)
                          </label>
                          <input
                            type="number"
                            name="parcelCount"
                            value={formData.parcelCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            POSB Deposits Total Volume (₹)
                          </label>
                          <input
                            type="number"
                            name="posbDepVol"
                            value={formData.posbDepVol}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            POSB Withdrawals Volume (₹)
                          </label>
                          <input
                            type="number"
                            name="posbWdVol"
                            value={formData.posbWdVol}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            PLI / RPLI Proposals (Count)
                          </label>
                          <input
                            type="number"
                            name="pliCount"
                            value={formData.pliCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            PLI Sum Assured (₹)
                          </label>
                          <input
                            type="number"
                            name="pliSumAssured"
                            value={formData.pliSumAssured}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            PLI / RPLI Premium Collected (₹)
                          </label>
                          <input
                            type="number"
                            name="pliPremium"
                            value={formData.pliPremium}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            Retail Services Count
                          </label>
                          <input
                            type="number"
                            name="retailCount"
                            value={formData.retailCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                          />
                        </div>
                      </div>
                    </div>

                    {/* Revenue Summary Card */}
                    <div className="bg-red-50 p-4 rounded-lg border border-red-200 space-y-2">
                      <div className="flex justify-between items-center border-b border-red-200 pb-2">
                        <span className="text-xs font-bold uppercase text-red-800">
                          Revenue Summary Calculator
                        </span>
                        <span className="text-xs bg-red-200 text-red-900 px-2 py-0.5 rounded font-mono">
                          Live Sync
                        </span>
                      </div>
                      <div className="flex justify-between items-center pt-1">
                        <span className="text-sm font-semibold text-slate-700">
                          Estimated Calculated Revenue
                        </span>
                        <span className="text-2xl font-black text-red-700">
                          ₹ {calculateRevenue().toLocaleString("en-IN")}
                        </span>
                      </div>
                    </div>

                    {/* WhatsApp Daily Report Format Block */}
                    <div className="bg-emerald-50 border border-emerald-300 rounded-lg p-4 space-y-3">
                      <div className="flex justify-between items-center">
                        <h3 className="text-xs font-bold uppercase text-emerald-800 tracking-wider">
                          📲 WhatsApp Daily Report Format Preview
                        </h3>
                        <span className="text-xs bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded">
                          Ready to Send
                        </span>
                      </div>
                      <div className="bg-white p-3 rounded border border-emerald-200 font-mono text-xs text-slate-700 whitespace-pre-wrap leading-relaxed select-all">
                        {generateWhatsAppText()}
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        <button
                          type="button"
                          onClick={copyToClipboard}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded text-xs shadow transition flex items-center justify-center gap-2"
                        >
                          📋 Copy for WhatsApp
                        </button>
                        <button
                          type="button"
                          onClick={shareOnWhatsApp}
                          className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded text-xs shadow transition flex items-center justify-center gap-2"
                        >
                          💬 Share on WhatsApp
                        </button>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg shadow-md text-sm transition"
                    >
                      Submit Daily Business Data to Division
                    </button>
                  </form>
                </div>
              )}

              {/* VIEW 2: DIVISION DASHBOARD & TOP PERFORMERS */}
              {view === "dashboard" && (
                <div className="space-y-6">
                  {/* Top Performers Podiums */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-5 rounded-lg shadow flex justify-between items-center">
                      <div>
                        <span className="bg-amber-700 text-amber-100 text-xs px-2 py-0.5 rounded font-bold uppercase">
                          🥇 Top Sub Office (SO) Today
                        </span>
                        <h3 className="text-xl font-bold mt-1">
                          {topSO ? topSO.name : "No submissions yet"}
                        </h3>
                        <p className="text-xs text-amber-100 mt-0.5">
                          SPM: {topSO ? topSO.incumbent : "-"}
                        </p>
                      </div>
                      <div className="text-right">
                        <span className="text-xs uppercase text-amber-200">
                          Revenue
                        </span>
                        <p className="text-2xl font-black">
                          ₹ {topSO ? topSO.revenue.toLocaleString("en-IN") : 0}
                        </p>
                      </div>
                    </div>

                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white p-5 rounded-lg shadow flex justify-between items-center">
                      <div>
                        <span className="bg-emerald-800 text-emerald-100 text-xs px-2 py-0.5 rounded font-bold uppercase">
                          🥇 Top Branch Office (BO) Today
                        </span>
                        <h3 className="text-xl font-bold mt-1">
                          {topBO ? topBO.name : "No submissions yet"}
                        </h3>
                        <p className="text-xs text-emerald-100 mt-0.5">
                          BPM: {topBO ? topBO.incumbent : "-"}
                        </p>
                      </div>
                      <div className="text-right">
                        <span className="text-xs uppercase text-emerald-200">
                          Revenue
                        </span>
                        <p className="text-2xl font-black">
                          ₹ {topBO ? topBO.revenue.toLocaleString("en-IN") : 0}
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Division Overview Table */}
                  <div className="bg-white rounded-lg shadow overflow-hidden">
                    <div className="p-4 border-b bg-slate-50 flex justify-between items-center">
                      <h3 className="font-bold text-slate-700 text-sm">
                        Lakhimpur Division - Daily Submissions Log
                      </h3>
                      <span className="text-xs bg-red-100 text-red-800 px-2 py-1 rounded font-bold">
                        Live Data Feed
                      </span>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-sm">
                        <thead>
                          <tr className="bg-slate-100 text-slate-600 border-b text-xs uppercase">
                            <th className="p-3">Office Name</th>
                            <th className="p-3">Type</th>
                            <th className="p-3">Incumbent / BPM</th>
                            <th className="p-3">Date</th>
                            <th className="p-3">Aadhaar</th>
                            <th className="p-3">PLI Prem. (₹)</th>
                            <th className="p-3 text-right">Revenue (₹)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {entries.map((item) => (
                            <tr
                              key={item.id}
                              className="border-b hover:bg-slate-50"
                            >
                              <td className="p-3 font-medium text-slate-800">
                                {item.name}
                              </td>
                              <td className="p-3">
                                <span
                                  className={`px-2 py-0.5 rounded text-xs font-bold ${item.type === "SO" ? "bg-indigo-100 text-indigo-700" : "bg-emerald-100 text-emerald-700"}`}
                                >
                                  {item.type}
                                </span>
                              </td>
                              <td className="p-3 text-slate-600 text-xs">
                                {item.incumbent}
                              </td>
                              <td className="p-3 text-slate-600">
                                {item.date}
                              </td>
                              <td className="p-3">{item.aadhaar}</td>
                              <td className="p-3">
                                ₹ {item.pli.toLocaleString("en-IN")}
                              </td>
                              <td className="p-3 text-right font-bold text-red-700">
                                ₹ {item.revenue.toLocaleString("en-IN")}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 3: ADMIN MASTER SETUP LOGIN */}
              {view === "admin" && (
                <div className="bg-white rounded-lg shadow-md p-6 max-w-xl mx-auto border-t-4 border-slate-700">
                  <h2 className="text-base font-bold text-slate-800 mb-1">
                    Division Admin Master Setup
                  </h2>
                  <p className="text-xs text-slate-500 mb-4">
                    Restricted access for Sub Divisional Inspector to manage
                    offices and personnel names.
                  </p>

                  {!isAdminAuthenticated ? (
                    <div className="space-y-4 bg-slate-50 p-4 rounded border">
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-600 mb-1">
                          Enter Admin Password
                        </label>
                        <input
                          type="password"
                          placeholder="Try any password (e.g., admin123)"
                          value={adminPassword}
                          onChange={(e) => setAdminPassword(e.target.value)}
                          className="w-full border rounded p-2 text-sm bg-white"
                        />
                      </div>
                      <button
                        onClick={() => {
                          if (adminPassword.trim().length > 0) {
                            setIsAdminAuthenticated(true);
                            showToast("Admin Authenticated Successfully");
                          } else {
                            showToast("Please enter password");
                          }
                        }}
                        className="w-full bg-slate-800 text-white font-bold py-2 rounded text-sm hover:bg-slate-900"
                      >
                        Authenticate Admin Access
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="bg-emerald-50 p-3 rounded border border-emerald-200 flex justify-between items-center text-xs text-emerald-800">
                        <span>
                          <strong>Status:</strong> Admin Session Active
                          (Lakhimpur Division)
                        </span>
                        <button
                          onClick={() => setIsAdminAuthenticated(false)}
                          className="underline text-red-700 font-bold"
                        >
                          Lock Session
                        </button>
                      </div>

                      <div className="border p-4 rounded bg-slate-50 space-y-3">
                        <h3 className="font-bold text-xs uppercase text-slate-700">
                          Add New SO or BO to Master Directory
                        </h3>
                        <div className="grid grid-cols-2 gap-2">
                          <input
                            type="text"
                            placeholder="Office ID (e.g. LKP_BO_05)"
                            value={newOffice.id}
                            onChange={(e) =>
                              setNewOffice({ ...newOffice, id: e.target.value })
                            }
                            className="border p-2 text-xs rounded bg-white"
                          />
                          <select
                            value={newOffice.type}
                            onChange={(e) =>
                              setNewOffice({
                                ...newOffice,
                                type: e.target.value,
                              })
                            }
                            className="border p-2 text-xs rounded bg-white"
                          >
                            <option value="BO">Branch Office (BO)</option>
                            <option value="SO">Sub Office (SO)</option>
                          </select>
                        </div>
                        <input
                          type="text"
                          placeholder="Office Full Name"
                          value={newOffice.name}
                          onChange={(e) =>
                            setNewOffice({ ...newOffice, name: e.target.value })
                          }
                          className="w-full border p-2 text-xs rounded bg-white"
                        />
                        <div className="grid grid-cols-2 gap-2">
                          <input
                            type="text"
                            placeholder="Incumbent / BPM Name"
                            value={newOffice.incumbent}
                            onChange={(e) =>
                              setNewOffice({
                                ...newOffice,
                                incumbent: e.target.value,
                              })
                            }
                            className="border p-2 text-xs rounded bg-white"
                          />
                          <input
                            type="text"
                            placeholder="Contact Mobile"
                            value={newOffice.contact}
                            onChange={(e) =>
                              setNewOffice({
                                ...newOffice,
                                contact: e.target.value,
                              })
                            }
                            className="border p-2 text-xs rounded bg-white"
                          />
                        </div>
                        <button
                          onClick={() => {
                            if (newOffice.id && newOffice.name) {
                              setOffices([...offices, newOffice]);
                              setNewOffice({
                                id: "",
                                name: "",
                                type: "BO",
                                incumbent: "",
                                contact: "",
                              });
                              showToast(
                                "Office successfully added to master directory!",
                              );
                            } else {
                              showToast("Please fill Office ID and Name.");
                            }
                          }}
                          className="w-full bg-red-700 text-white font-bold py-2 rounded text-xs hover:bg-red-800"
                        >
                          Save Office & Personnel to Master List
                        </button>
                      </div>

                      <div>
                        <h3 className="font-bold text-xs uppercase text-slate-600 mb-2">
                          Registered Offices ({offices.length})
                        </h3>
                        <div className="space-y-1 max-h-48 overflow-y-auto border rounded p-2 bg-slate-50 text-xs">
                          {offices.map((o) => (
                            <div
                              key={o.id}
                              className="flex justify-between items-center bg-white p-2 border-b"
                            >
                              <span>
                                <strong>{o.name}</strong> ({o.type}) —{" "}
                                <em>{o.incumbent}</em>
                              </span>
                              <span className="text-slate-400 font-mono">
                                {o.id}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
