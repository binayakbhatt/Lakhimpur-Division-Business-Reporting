<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakhimpur Postal Division - Business Reporting</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const API_BASE_URL = "__API_URL__".replace(/\/+$/, "");

      function App() {
        const [view, setView] = React.useState("entry");

        const [offices, setOffices] = React.useState([]);
        const [entries, setEntries] = React.useState([]);
        const [selectedOfficeId, setSelectedOfficeId] = React.useState("");
        const [entryDate, setEntryDate] = React.useState(
          new Date().toISOString().split("T")[0],
        );

        const [dashboardFilterMode, setDashboardFilterMode] = React.useState("all");

        const [formData, setFormData] = React.useState({
          posbAccountsOpened: 0,
          pliCount: 0,
          pliPremium: 0,
          rpliCount: 0,
          rpliPremium: 0,
          gangajalSold: 0,
          speedPostBooked: 0,
          speedPostParcelBooked: 0,
          aadhaarAmountCollected: 0,
          savingCertificate: 0,
        });

        const [adminPassword, setAdminPassword] = React.useState("");

        const [isAdminAuthenticated, setIsAdminAuthenticated] = React.useState(() => {
          return sessionStorage.getItem("lakhimpur_admin_auth") === "true";
        });

        const [isUploading, setIsUploading] = React.useState(false);
        const [isEditingOffice, setIsEditingOffice] = React.useState(false);
        const [newOffice, setNewOffice] = React.useState({
          id: "",
          name: "",
          type: "BO",
          parent_ho_so: "North Lakhimpur HO",
          pincode: "",
          incumbent: "",
          contact: "",
        });

        const [toastMessage, setToastMessage] = React.useState("");

        const showToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(""), 3500);
        };

        React.useEffect(() => {
          fetchOffices();
          fetchEntries();
        }, []);

        const fetchOffices = async () => {
          try {
            const res = await fetch(`${API_BASE_URL}/api/offices`);
            if (res.ok) {
              const data = await res.json();
              setOffices(data);
              if (data.length > 0 && !selectedOfficeId) {
                setSelectedOfficeId(data[0].office_id || data[0].id);
              }
            }
          } catch (e) {
            console.error("Failed to load offices from backend", e);
            showToast("Error connecting to backend server");
          }
        };

        const fetchEntries = async () => {
          try {
            const res = await fetch(`${API_BASE_URL}/api/entries`);
            if (res.ok) {
              const data = await res.json();
              setEntries(data);
            }
          } catch (e) {
            console.error("Failed to load entries from backend", e);
          }
        };

        const handleEditOffice = (office) => {
          setNewOffice({
            id: office.office_id || office.id || "",
            name: office.office_name || office.name || "",
            type: office.office_type || office.type || "BO",
            parent_ho_so: office.parent_ho_so || "North Lakhimpur HO",
            pincode: office.pincode || "",
            incumbent: office.incumbent_name || office.incumbent || "",
            contact: office.contact_number || office.contact || "",
          });
          setIsEditingOffice(true);
          showToast(`Editing ${office.office_name || office.name}`);
        };

        const handleDeleteOffice = async (office) => {
          const oId = office.office_id || office.id;
          const oName = office.office_name || office.name;
          if (!window.confirm(`Are you sure you want to delete "${oName}" (${oId})? This will also remove any daily entries linked to this office.`)) {
            return;
          }

          try {
            const res = await fetch(
              `${API_BASE_URL}/api/offices?office_id=${encodeURIComponent(oId)}`,
              { method: "DELETE" }
            );
            if (res.ok) {
              showToast(`Deleted office: ${oName}`);
              if (selectedOfficeId === oId) setSelectedOfficeId("");
              fetchOffices();
              fetchEntries();
            } else {
              showToast("Failed to delete office from backend");
            }
          } catch (err) {
            showToast("Network error while deleting office");
          }
        };

        const parseCSV = (csvText) => {
          const lines = csvText
            .split(/\r?\n/)
            .map((l) => l.trim())
            .filter((l) => l.length > 0);
          if (lines.length < 2) return [];

          const splitLine = (line) => {
            const result = [];
            let cur = "";
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
              const ch = line[i];
              if (ch === '"') {
                inQuotes = !inQuotes;
              } else if (ch === "," && !inQuotes) {
                result.push(cur.trim());
                cur = "";
              } else {
                cur += ch;
              }
            }
            result.push(cur.trim());
            return result;
          };

          const headers = splitLine(lines[0]).map((h) =>
            h.toLowerCase().replace(/\s+/g, "_")
          );

          return lines.slice(1).map((line) => {
            const values = splitLine(line);
            const obj = {};
            headers.forEach((h, idx) => {
              obj[h] = values[idx] !== undefined ? values[idx] : "";
            });
            return obj;
          });
        };

        const downloadSampleCSV = (type) => {
          let csvContent = "";
          let filename = "";
          if (type === "offices") {
            csvContent =
              "office_id,office_name,office_type,parent_ho_so,pincode,incumbent_name,contact_number\n" +
              "LKP_SO_01,Bihpuria S.O.,SO,North Lakhimpur HO,784161,Smti Ananya Hazarika,9864022222\n" +
              "LKP_BO_01,Gereki B.O.,BO,Bihpuria S.O.,784161,Shri Ramesh Gogoi,9864033333";
            filename = "sample_offices_template.csv";
          } else {
            csvContent =
              "office_id,entry_date,posb_accounts_opened,saving_certificate,pli_count,pli_premium,rpli_count,rpli_premium,gangajal_sold,speed_post_booked,speed_post_parcel_booked,aadhaar_amount_collected\n" +
              `LKP_HO_01,${entryDate},5,2,1,15000,2,8000,3,1200,500,2500`;
            filename = "sample_daily_entries_template.csv";
          }

          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.setAttribute("download", filename);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const exportEntriesToCSV = (rowsToExport) => {
          if (!rowsToExport || rowsToExport.length === 0) {
            showToast("No entries available to export.");
            return;
          }

          const headers = [
            "Entry ID",
            "Entry Date",
            "Office ID",
            "Office Name",
            "Office Type",
            "Incumbent / BPM",
            "POSB Accounts Opened",
            "Saving Certificates",
            "PLI Policies Count",
            "PLI Premium (INR)",
            "RPLI Policies Count",
            "RPLI Premium (INR)",
            "Gangajal Sold",
            "Speed Post Booked (INR)",
            "Speed Post Parcel Booked (INR)",
            "Aadhaar Amount Collected (INR)",
            "Calculated Revenue (INR)",
            "Submission Timestamp"
          ];

          const escapeCSVCell = (val) => {
            const str = String(val !== undefined && val !== null ? val : "");
            if (str.includes(",") || str.includes('"') || str.includes("\n")) {
              return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
          };

          const csvRows = rowsToExport.map((item) => [
            item.entry_id || item.id || "",
            item.entry_date || item.date || "",
            item.office_id || "",
            item.office_name || item.name || "",
            item.office_type || item.type || "",
            item.incumbent_name || item.incumbent || "",
            item.posb_accounts_opened ?? item.posbAccountsOpened ?? 0,
            item.saving_certificate ?? item.savingCertificate ?? 0,
            item.pli_count ?? item.pliCount ?? 0,
            item.pli_premium ?? item.pliPremium ?? 0,
            item.rpli_count ?? item.rpliCount ?? 0,
            item.rpli_premium ?? item.rpliPremium ?? 0,
            item.gangajal_sold ?? item.gangajalSold ?? 0,
            item.speed_post_booked ?? item.speedPostBooked ?? 0,
            item.speed_post_parcel_booked ?? item.speedPostParcelBooked ?? 0,
            item.aadhaar_amount_collected ?? item.aadhaarAmountCollected ?? 0,
            item.calculated_revenue ?? item.revenue ?? 0,
            item.timestamp || ""
          ].map(escapeCSVCell).join(","));

          const csvString = "\uFEFF" + [headers.join(","), ...csvRows].join("\n");
          const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const suffix = dashboardFilterMode === "date" ? entryDate : "all_dates";
          link.href = url;
          link.setAttribute("download", `Lakhimpur_Division_Report_${suffix}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          showToast(`📥 Exported ${rowsToExport.length} records to CSV!`);
        };

        const handleCSVUpload = async (e, endpointType) => {
          const file = e.target.files[0];
          if (!file) return;

          setIsUploading(true);
          try {
            const text = await file.text();
            const rows = parseCSV(text);
            if (rows.length === 0) {
              showToast("CSV file is empty or missing data rows.");
              setIsUploading(false);
              return;
            }

            const endpoint =
              endpointType === "offices"
                ? `${API_BASE_URL}/api/offices`
                : `${API_BASE_URL}/api/entries`;

            const res = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(rows),
            });

            const result = await res.json();
            if (res.ok) {
              showToast(
                `Successfully imported ${result.count || rows.length} ${endpointType} records from CSV!`
              );
              if (endpointType === "offices") fetchOffices();
              else fetchEntries();
            } else {
              showToast(`CSV Import Error: ${result.error || "Failed to import"}`);
            }
          } catch (err) {
            showToast("Failed to read or upload CSV file.");
          } finally {
            setIsUploading(false);
            e.target.value = "";
          }
        };

        const currentOffice =
          offices.find((o) => (o.office_id || o.id) === selectedOfficeId) || offices[0] || {
            office_id: "",
            name: "Loading...",
            type: "BO",
            incumbent_name: "",
            contact_number: ""
          };

        const incumbentName = currentOffice.incumbent_name || currentOffice.incumbent || "";
        const contactNum = currentOffice.contact_number || currentOffice.contact || "";

        const calculateRevenue = () => {
          const posbRev = Math.max(0, Number(formData.posbAccountsOpened) || 0) * 219.23;
          const savingCertRev = Math.max(0, Number(formData.savingCertificate) || 0) * 73.25;
          const pliRev = Math.max(0, Number(formData.pliPremium) || 0) * 0.04;
          const rpliRev = Math.max(0, Number(formData.rpliPremium) || 0) * 0.12;
          const gangajalRev = Math.max(0, Number(formData.gangajalSold) || 0) * 30;
          
          const speedPostRev = Math.max(0, Number(formData.speedPostBooked) || 0) * 0.82;
          const parcelRev = Math.max(0, Number(formData.speedPostParcelBooked) || 0) * 0.82;
          const aadhaarRev = Math.max(0, Number(formData.aadhaarAmountCollected) || 0) * 0.82;

          const total = posbRev + savingCertRev + pliRev + rpliRev + gangajalRev + speedPostRev + parcelRev + aadhaarRev;
          return Math.round(total * 100) / 100;
        };

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          let numVal = parseFloat(value);
          if (isNaN(numVal) || numVal < 0) numVal = 0;
          if (numVal > 100000000) numVal = 100000000;
          setFormData((prev) => ({ ...prev, [name]: numVal }));
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!selectedOfficeId) {
            showToast("Please select a valid office");
            return;
          }

          const totalRev = calculateRevenue();
          const payload = {
            office_id: selectedOfficeId,
            entry_date: entryDate,
            posb_accounts_opened: formData.posbAccountsOpened,
            pli_count: formData.pliCount,
            pli_premium: formData.pliPremium,
            rpli_count: formData.rpliCount,
            rpli_premium: formData.rpliPremium,
            gangajal_sold: formData.gangajalSold,
            speed_post_booked: formData.speedPostBooked,
            speed_post_parcel_booked: formData.speedPostParcelBooked,
            aadhaar_amount_collected: formData.aadhaarAmountCollected,
            saving_certificate: formData.savingCertificate,
            calculated_revenue: totalRev
          };

          try {
            const res = await fetch(`${API_BASE_URL}/api/entries`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              showToast(`Daily Report Submitted Successfully! Calculated Revenue: ₹${totalRev.toLocaleString("en-IN")}`);
              fetchEntries();
              setView("dashboard");
            } else {
              showToast("Failed to submit report. Please check input data.");
            }
          } catch (err) {
            showToast("Network error during submission");
          }
        };

        const generateWhatsAppText = () => {
          const totalRev = calculateRevenue();
          const officeNameStr = currentOffice.office_name || currentOffice.name || "";
          const officeTypeStr = currentOffice.office_type || currentOffice.type || "";
          return (
            `📌 *LAKHIMPUR POSTAL DIVISION - DAILY BUSINESS REPORT* 📌\n` +
            `📅 Date: ${entryDate}\n` +
            `🏢 Office: ${officeNameStr} (${officeTypeStr})\n` +
            `👤 Official/BPM: ${incumbentName} (${contactNum})\n\n` +
            `--- *BUSINESS TRANSACTIONS* ---\n` +
            `• No. of POSB accounts opened: ${formData.posbAccountsOpened}\n` +
            `• Saving certificate: ${formData.savingCertificate}\n` +
            `• No. of PLI: ${formData.pliCount}\n` +
            `• PLI premium: ₹${Number(formData.pliPremium || 0).toLocaleString("en-IN")}\n` +
            `• No. of RPLI: ${formData.rpliCount}\n` +
            `• RPLI premium: ₹${Number(formData.rpliPremium || 0).toLocaleString("en-IN")}\n` +
            `• Gangajal sold: ${formData.gangajalSold}\n` +
            `• Speed Post booked: ₹${Number(formData.speedPostBooked || 0).toLocaleString("en-IN")}\n` +
            `• Speed Post Parcel booked: ₹${Number(formData.speedPostParcelBooked || 0).toLocaleString("en-IN")}\n` +
            `• Aadhaar amount collected: ₹${Number(formData.aadhaarAmountCollected || 0).toLocaleString("en-IN")}\n\n` +
            `💰 *Estimated Calculated Revenue:* *₹ ${totalRev.toLocaleString("en-IN")}*`
          );
        };

        const copyToClipboard = () => {
          navigator.clipboard.writeText(generateWhatsAppText());
          showToast("📋 Copied Daily Report to Clipboard for WhatsApp!");
        };

        const shareOnWhatsApp = () => {
          const text = encodeURIComponent(generateWhatsAppText());
          window.open(`https://api.whatsapp.com/send?text=${text}`, "_blank");
        };

        const todayEntries = entries.filter((e) => (e.entry_date || e.date) === entryDate);
        const displayedEntries = dashboardFilterMode === "date" ? todayEntries : entries;

        const topSO = todayEntries
          .filter((e) => ["SO", "HO"].includes(e.office_type || e.type))
          .sort((a, b) => Number(b.calculated_revenue ?? b.revenue ?? 0) - Number(a.calculated_revenue ?? a.revenue ?? 0))[0];
        const topBO = todayEntries
          .filter((e) => (e.office_type || e.type) === "BO")
          .sort((a, b) => Number(b.calculated_revenue ?? b.revenue ?? 0) - Number(a.calculated_revenue ?? a.revenue ?? 0))[0];

        return (
          <div className="min-h-screen flex flex-col bg-slate-100">
            {toastMessage && (
              <div className="fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm font-medium border border-slate-700 animate-bounce">
                {toastMessage}
              </div>
            )}

            <header className="bg-red-800 text-white shadow">
              <div className="max-w-5xl mx-auto p-4 flex flex-col md:flex-row justify-between items-center gap-3">
                <div>
                  <h1 className="text-lg font-bold">
                    Lakhimpur Postal Division Business Radar
                  </h1>
                  <p className="text-xs text-red-200">
                    Sub Divisional Office & Branch Office Daily Analytics
                  </p>
                </div>
                <nav className="flex space-x-2">
                  <button
                    onClick={() => setView("entry")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "entry" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Daily Entry (No Login)
                  </button>
                  <button
                    onClick={() => setView("dashboard")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "dashboard" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Division Dashboard & Leaders
                  </button>
                  <button
                    onClick={() => setView("admin")}
                    className={`px-3 py-1.5 rounded text-sm font-medium ${view === "admin" ? "bg-white text-red-800" : "bg-red-900 text-red-100"}`}
                  >
                    Admin Master Setup
                  </button>
                </nav>
              </div>
            </header>

            <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
              {view === "entry" && (
                <div className="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto border-t-4 border-red-700 space-y-6">
                  <div className="pb-3 border-b flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-bold text-slate-800">
                        Daily Business Data Entry
                      </h2>
                      <p className="text-xs text-slate-500">
                        Select your office from the list below to log daily metrics
                      </p>
                    </div>
                    <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-medium">
                      No Login Required
                    </span>
                  </div>

                  <form onSubmit={handleSubmit} className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded border">
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-600 mb-1">
                          Select Office Name
                        </label>
                        <select
                          value={selectedOfficeId}
                          onChange={(e) => setSelectedOfficeId(e.target.value)}
                          className="w-full border rounded p-2 text-sm bg-white font-medium"
                          required
                        >
                          {offices.map((o) => {
                            const oId = o.office_id || o.id;
                            const oName = o.office_name || o.name;
                            const oType = o.office_type || o.type;
                            return (
                              <option key={oId} value={oId}>
                                {oName} ({oType})
                              </option>
                            );
                          })}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold uppercase text-slate-600 mb-1">
                          Reporting Date
                        </label>
                        <input
                          type="date"
                          value={entryDate}
                          onChange={(e) => setEntryDate(e.target.value)}
                          className="w-full border rounded p-2 text-sm bg-white"
                          required
                        />
                      </div>
                      <div className="md:col-span-2 text-xs text-slate-600 flex justify-between bg-white p-2.5 rounded border">
                        <span>
                          <strong>Incumbent Official / BPM:</strong> {incumbentName}
                        </span>
                        <span>
                          <strong>Contact:</strong> {contactNum}
                        </span>
                      </div>
                    </div>

                    <div className="border rounded-lg p-4 space-y-4 bg-white shadow-sm">
                      <div className="border-b pb-2">
                        <h3 className="font-bold text-slate-800 text-sm">
                          Business Transactions
                        </h3>
                        <p className="text-xs text-slate-500">
                          Enter daily volumes and figures for accounts, insurance, and postal services
                        </p>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            No. of POSB accounts opened
                          </label>
                          <input
                            type="number"
                            name="posbAccountsOpened"
                            value={formData.posbAccountsOpened}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                            max="1000"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            Saving certificate (Count)
                          </label>
                          <input
                            type="number"
                            name="savingCertificate"
                            value={formData.savingCertificate}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                            max="10000"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            No. of PLI
                          </label>
                          <input
                            type="number"
                            name="pliCount"
                            value={formData.pliCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                            max="1000"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            PLI premium (₹)
                          </label>
                          <input
                            type="number"
                            name="pliPremium"
                            value={formData.pliPremium}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                            max="10000000"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-500 mb-1">
                            No. of RPLI
                          </label>
                          <input
                            type="number"
                            name="rpliCount"
                            value={formData.rpliCount}
                            onChange={handleInputChange}
                            className="w-full border rounded p-2 text-sm"
                            min="0"
                            max="1000"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold uppercase text-slate-
